# Builds and tests on GitHub's own Macs, because the SDK needs Xcode. Open the "Actions" tab of this repository to see the result.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core-tests:
    name: Core logic tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test the core (runs the XCTest suite on an iPhone simulator, the platform the SDK is for)
        run: |
          set -o pipefail
          xcodebuild -list 2>&1 | tail -15
          xcodebuild -scheme VisionForgeX-Package -destination 'platform=iOS Simulator,name=iPhone 16' -skipPackagePluginValidation test 2>&1 | tail -80
  ios-build:
    name: Build for iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the SDK for iOS
        run: |
          set -o pipefail
          xcodebuild -scheme VisionForgeX -destination 'generic/platform=iOS' -skipPackagePluginValidation build 2>&1 | tail -60
